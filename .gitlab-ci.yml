default:
  image: golang:1.26-bookworm
  tags:
    - ennote-dev

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always

stages:
  - test
  - build

format_job:
  stage: test
  script:
    - go fmt ./...

vet_job:
  stage: test
  script:
    - go vet ./...

test_job:
  stage: test
  script:
    - go test -race -coverprofile=coverage.txt -covermode=atomic ./...
 
lint_job:
  stage: test
  image: golangci/golangci-lint:v2.13-alpine
  script:
    - golangci-lint run
